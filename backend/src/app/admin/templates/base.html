<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mi Música{% endblock %} · Mi Música</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { color-scheme: light; --fg:#1a1a1a; --bg:#fafaf7; --accent:#0b5cad; --danger:#b3261e; --ok:#1b7a34; --line:#d8d8d0; }
    * { box-sizing: border-box; }
    body { margin:0; font:22px/1.5 system-ui, "Segoe UI", sans-serif; color:var(--fg); background:var(--bg); }
    header { background:#fff; border-bottom:2px solid var(--line); padding:.6rem 1.2rem; display:flex; gap:1.2rem; align-items:center; flex-wrap:wrap; }
    header strong { font-size:1.2em; }
    nav a { padding:.5rem 1rem; border-radius:.5rem; color:var(--accent); text-decoration:none; font-weight:600; }
    nav a.active { background:var(--accent); color:#fff; }
    main { max-width:60rem; margin:0 auto; padding:1.2rem; }
    h1 { font-size:1.6em; margin:.2em 0 .6em; }
    input, select, button { font:inherit; padding:.5rem .8rem; border:2px solid #888; border-radius:.5rem; background:#fff; }
    input[type=text], input[type=search] { min-width:16rem; }
    input[type=number] { width:8rem; }
    button { cursor:pointer; background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    button.secondary { background:#fff; color:var(--accent); }
    button.danger { background:var(--danger); border-color:var(--danger); }
    .card { background:#fff; border:2px solid var(--line); border-radius:.8rem; padding:.8rem 1rem; margin:.8rem 0; }
    .muted { color:#555; font-size:.85em; }
    .badge { display:inline-block; padding:0 .5rem; border-radius:1rem; background:#e8f0fb; color:var(--accent); font-size:.8em; }
    .ok { color:var(--ok); font-weight:600; }
    .err { color:var(--danger); font-weight:600; }
    .row { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
    form.inline { display:inline-flex; gap:.4rem; align-items:center; margin:0; }
    ol.songs { padding-left:1.4rem; }
    :focus-visible { outline:3px solid #f5a623; outline-offset:2px; }
  </style>
</head>
<body>
  <header>
    <strong>Mi Música · Panel</strong>
    <nav>
      <a href="/admin/search" class="{{ 'active' if active == 'search' }}">Buscar</a>
      <a href="/admin/library" class="{{ 'active' if active == 'library' }}">Biblioteca</a>
      <a href="/admin/playlists" class="{{ 'active' if active == 'playlists' }}">Listas</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
