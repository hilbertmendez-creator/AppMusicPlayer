{% extends "base.html" %}
{% block title %}Buscar{% endblock %}
{% block content %}
<h1>Buscar canciones</h1>
<form hx-get="/admin/search/results" hx-target="#results" hx-indicator="#loading" class="row">
  <input type="search" name="q" maxlength="200" required autofocus
         placeholder="Título, artista o un pedazo de la letra" aria-label="Buscar">
  <select name="mode" aria-label="Tipo de búsqueda">
    <option value="auto">Automático</option>
    <option value="title">Por título o artista</option>
    <option value="lyrics">Por letra</option>
  </select>
  <button type="submit">Buscar</button>
  <span id="loading" class="htmx-indicator muted">Buscando…</span>
</form>
<div id="results"></div>
<style>.htmx-indicator{opacity:0}.htmx-request .htmx-indicator,.htmx-request.htmx-indicator{opacity:1}</style>
{% endblock %}
